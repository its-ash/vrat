name: vrat
description: "Vrat: offline Hindu fasting and festival calendar with reminders."
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  theme:
    path: ../theme
  geolocator: ^14.1.2
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/geo/cities.json

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/logo-1024.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/logo_background-1024.png"
  adaptive_icon_foreground: "assets/icon/logo_foreground-1024.png"
